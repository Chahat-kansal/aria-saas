<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Aria Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#7FB897;--pine:#2D5240;--tan:#c9a37a;
  --bg:#0c1310;--bg2:#070b09;--card:#121b17;
  --glass:rgba(255,255,255,.05);--brd:rgba(255,255,255,.08);
  --txt:#eaf0ea;--mut:#9aae a2;--mut:#9aaea2;--dim:#677b70;--live:#ff5a6e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#000;color:var(--txt);display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:440px;height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));position:relative;overflow:hidden;
  border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}
.fr{font-family:'Fraunces',serif}.it{font-style:italic}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* SCREEN SYSTEM */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg),var(--bg2));
  transform:translateX(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);will-change:transform;overflow:hidden}
.screen.active{transform:translateX(0)}
.screen.behind{transform:translateX(-22%);filter:brightness(.6)}
.screen.root{transform:translateX(0)}
.screen.root.behind{transform:translateX(-22%);filter:brightness(.6)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* TOP BAR */
.tbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(12,19,16,.97),rgba(12,19,16,.5));backdrop-filter:blur(16px)}
.tbar .back{cursor:pointer;color:var(--txt);display:flex;align-items:center}
.tbar h2{font-size:16px;font-weight:600}
.logo{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:26px;letter-spacing:-.5px;
  background:linear-gradient(95deg,var(--sage),var(--tan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tbar-actions{display:flex;gap:18px;align-items:center;color:var(--txt)}
.tbar-actions .ico{width:25px;height:25px}
.badge-n{position:relative}
.badge-n::after{content:"";position:absolute;top:-1px;right:-1px;width:8px;height:8px;background:var(--live);border-radius:50%;border:2px solid var(--bg)}

/* MODE TOGGLE */
.modesw{display:flex;background:var(--glass);border:1px solid var(--brd);border-radius:30px;padding:3px;gap:3px;position:relative;width:186px}
.modesw button{flex:1;border:0;background:0;color:var(--mut);font-family:inherit;font-size:12px;font-weight:700;padding:7px 0;
  border-radius:24px;cursor:pointer;z-index:2;transition:color .25s}
.modesw .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:24px;z-index:1;
  background:linear-gradient(135deg,var(--pine),#1d3327);border:1px solid rgba(127,184,151,.4);
  transition:transform .3s cubic-bezier(.5,1.5,.5,1)}
.app[data-mode="owner"] .pill{transform:translateX(100%)}
.app[data-mode="owner"] .modesw button:last-child{color:var(--txt)}
.app[data-mode="customer"] .modesw button:first-child{color:var(--txt)}

/* STORIES RAIL */
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--brd)}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;width:66px;text-align:center;cursor:pointer}
.story .ring{width:64px;height:64px;border-radius:50%;padding:2.5px;background:conic-gradient(from 210deg,var(--sage),var(--tan),var(--live),var(--sage));
  display:flex;align-items:center;justify-content:center;transition:transform .2s}
.story:active .ring{transform:scale(.92)}
.story.seen .ring{background:var(--brd)}
.story.own .ring{background:var(--brd);position:relative}
.story img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg)}
.story .add{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;background:var(--sage);border:3px solid var(--bg);
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0c1410;font-weight:800;font-size:15px;line-height:1}
.story span{font-size:11px;color:var(--mut);margin-top:5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* POST */
.post{border-bottom:1px solid var(--brd);animation:fadein .5s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.phead{display:flex;align-items:center;gap:10px;padding:11px 14px}
.phead img.av{width:38px;height:38px;border-radius:50%;object-fit:cover}
.phead .av-ring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,var(--sage),var(--tan),var(--sage))}
.phead .av-ring img{width:36px;height:36px;border:2px solid var(--bg)}
.phead .who{flex:1;line-height:1.3}
.phead .who b{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.verif{width:13px;height:13px;fill:var(--sage);stroke:none}
.phead .who small{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.pos-live{display:inline-flex;align-items:center;gap:4px;background:rgba(255,90,110,.14);border:1px solid rgba(255,90,110,.4);
  color:#ff8b9a;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pp 1.5s infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(255,90,110,.6)}70%{box-shadow:0 0 0 6px rgba(255,90,110,0)}100%{box-shadow:0 0 0 0 transparent}}
.media{position:relative;width:100%;aspect-ratio:1;background:#0a0f0d;overflow:hidden}
.media .track{display:flex;height:100%;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.media .track img{width:100%;height:100%;object-fit:cover;flex-shrink:0}
.dots{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s}
.dots i.on{background:#fff;width:7px;height:7px}
.posbadge{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:6px;
  background:rgba(8,12,10,.62);backdrop-filter:blur(10px);border:1px solid var(--brd);padding:7px 12px;border-radius:30px;
  font-size:12px;font-weight:700;color:var(--sage)}
.pacts{display:flex;align-items:center;gap:18px;padding:12px 14px 6px}
.pacts .ico{width:25px;height:25px;cursor:pointer;transition:transform .15s}
.pacts .ico:active{transform:scale(.8)}
.pacts .liked{fill:var(--live);stroke:var(--live)}
.pacts .sp{flex:1}
.plikes{padding:0 14px;font-size:13px;font-weight:700}
.pcap{padding:5px 14px;font-size:13.5px;line-height:1.45}
.pcap b{font-weight:600}
.pcmt{padding:4px 14px;font-size:13px;color:var(--mut);cursor:pointer}
.ptime{padding:3px 14px 14px;font-size:10.5px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
.ai-flag{display:inline-flex;align-items:center;gap:4px;color:var(--tan);font-size:10px;font-weight:700;margin-left:6px}

/* AI INSIGHT POST */
.aipost{margin:14px;border-radius:22px;overflow:hidden;border:1px solid rgba(127,184,151,.3);
  background:linear-gradient(135deg,rgba(45,82,64,.5),rgba(18,27,23,.6));padding:17px;position:relative;animation:fadein .5s both}
.aipost::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(127,184,151,.22),transparent 70%)}
.aih{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--sage);margin-bottom:8px}
.aib{font-size:13.5px;line-height:1.55}.aib b{color:var(--sage);font-weight:600}
.aicta{display:flex;gap:8px;margin-top:13px}
.aicta button{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;padding:10px;border-radius:12px;border:1px solid var(--brd);
  background:var(--glass);color:var(--txt);cursor:pointer;transition:.15s}
.aicta button.prim{background:var(--sage);color:#0c1410;border-color:var(--sage)}
.aicta button:active{transform:scale(.97)}
.ground{margin-top:10px;font-size:9.5px;color:var(--dim);display:flex;align-items:center;gap:5px}

/* BOTTOM NAV */
.bnav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 24px;background:linear-gradient(180deg,transparent,rgba(7,11,9,.97) 32%);backdrop-filter:blur(18px);
  border-top:1px solid var(--brd);z-index:40}
.bnav button{background:0;border:0;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9px;font-weight:600;font-family:inherit;transition:color .2s}
.bnav button.on{color:var(--txt)}
.bnav .fab{margin-top:-22px;width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--sage),var(--pine));
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(127,184,151,.4)}
.bnav .fab .ico{color:#0c1410;stroke-width:2.4}
.bnav .meav{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid var(--dim)}
.bnav button.on .meav{border-color:var(--sage)}

/* PROFILE */
.pf-cover{height:120px;background-size:cover;background-position:center;position:relative}
.pf-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg))}
.pf-top{padding:0 18px;margin-top:-38px;position:relative;z-index:2;display:flex;align-items:flex-end;gap:16px}
.pf-av{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
.pf-av-w{padding:2.5px;border-radius:50%;background:conic-gradient(from 210deg,var(--sage),var(--tan),var(--live),var(--sage))}
.pf-stats{flex:1;display:flex;justify-content:space-around;padding-bottom:6px}
.pf-stats div{text-align:center}.pf-stats b{font-size:17px;font-weight:700;display:block}.pf-stats span{font-size:11px;color:var(--mut)}
.pf-info{padding:12px 18px 0}
.pf-name{font-family:'Fraunces',serif;font-weight:600;font-size:20px;display:flex;align-items:center;gap:6px}
.pf-cat{font-size:12.5px;color:var(--tan);font-weight:600;margin-top:1px}
.pf-bio{font-size:13px;color:var(--txt);line-height:1.5;margin-top:7px}
.pf-meta{font-size:12px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:6px}
.pf-livebar{margin:12px 18px 0;display:flex;align-items:center;gap:8px;background:rgba(255,90,110,.1);border:1px solid rgba(255,90,110,.35);
  border-radius:14px;padding:11px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.pf-btns{display:flex;gap:8px;padding:14px 18px}
.pf-btns button{flex:1;font-family:inherit;font-size:13px;font-weight:700;padding:10px;border-radius:11px;border:1px solid var(--brd);
  background:var(--glass);color:var(--txt);cursor:pointer;transition:.15s}
.pf-btns button.prim{background:var(--sage);color:#0c1410;border-color:var(--sage)}
.pf-btns button.foll{background:var(--card)}
.pf-btns button:active{transform:scale(.97)}
.pf-tabs{display:flex;border-top:1px solid var(--brd);border-bottom:1px solid var(--brd);margin-top:6px}
.pf-tabs button{flex:1;background:0;border:0;padding:12px 0;color:var(--dim);cursor:pointer;display:flex;justify-content:center;border-bottom:2px solid transparent}
.pf-tabs button.on{color:var(--txt);border-bottom-color:var(--sage)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding-bottom:90px}
.grid .cell{aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer;background:#0a0f0d}
.grid .cell img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.grid .cell:active img{transform:scale(1.05)}
.grid .cell .tag{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.grid .cell .tag .ico{width:16px;height:16px;stroke-width:2.2}

/* REELS IMMERSIVE */
.reels{position:absolute;inset:0;background:#000;z-index:80;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.reels.active{transform:translateY(0)}
.reels .rscroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels .rscroll::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reel img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 25%,transparent 55%,rgba(0,0,0,.8))}
.reel .rtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px;z-index:5}
.reel .rtop .ttl{font-size:17px;font-weight:700}
.reel .livetag{display:flex;align-items:center;gap:6px;background:var(--live);padding:5px 11px;border-radius:8px;font-size:12px;font-weight:800}
.reel .viewers{background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;display:flex;gap:5px;align-items:center}
.reel .rside{position:absolute;right:12px;bottom:130px;z-index:5;display:flex;flex-direction:column;gap:22px;align-items:center}
.reel .rside .act{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.reel .rside .act .ico{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.reel .rside .act span{font-size:11px;font-weight:700}
.reel .rside .liked{fill:var(--live);stroke:var(--live)}
.reel .rbot{position:absolute;left:14px;right:80px;bottom:34px;z-index:5}
.reel .rbot .rwho{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.reel .rbot .rwho img{width:36px;height:36px;border-radius:50%;border:1.5px solid #fff;object-fit:cover}
.reel .rbot .rwho b{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px}
.reel .rbot .rwho button{margin-left:4px;background:0;border:1px solid #fff;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:4px 12px;border-radius:8px;cursor:pointer}
.reel .rbot .rcap{font-size:13px;line-height:1.4}
.reel .rbot .rpos{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(127,184,151,.2);backdrop-filter:blur(8px);
  border:1px solid rgba(127,184,151,.5);padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700;color:#bfe6cd}
.reel-close{position:absolute;top:16px;right:16px;z-index:10;cursor:pointer}

/* LIVE CHAT OVERLAY */
.lchat{position:absolute;left:14px;bottom:130px;right:80px;z-index:6;max-height:160px;overflow:hidden;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.lchat .msg{font-size:12.5px;animation:slideup .4s both}
.lchat .msg b{font-weight:700;color:var(--sage)}
@keyframes slideup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* POST DETAIL / COMMENTS */
.cmts{padding:4px 0 90px}
.cmt{display:flex;gap:11px;padding:11px 16px}
.cmt img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0}
.cmt .ct{flex:1;font-size:13px;line-height:1.45}
.cmt .ct b{font-weight:600}.cmt .ct .meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:14px}
.cmt .heart{color:var(--dim);cursor:pointer}
.cmt.ai{background:rgba(127,184,151,.06)}
.cmt.ai .ct b{color:var(--sage)}
.cinput{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px 26px;
  background:linear-gradient(180deg,transparent,var(--bg2) 25%);backdrop-filter:blur(14px);border-top:1px solid var(--brd)}
.cinput img{width:32px;height:32px;border-radius:50%}
.cinput .box{flex:1;background:var(--glass);border:1px solid var(--brd);border-radius:30px;padding:10px 16px;font-size:13px;color:var(--dim)}
.cinput .send{color:var(--sage);font-weight:700;font-size:13px;cursor:pointer}

/* SETTINGS */
.set-search{margin:8px 16px 6px;background:var(--glass);border:1px solid var(--brd);border-radius:12px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}
.acenter{margin:10px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(45,82,64,.4),rgba(18,27,23,.5));
  border:1px solid var(--brd);padding:16px;cursor:pointer;transition:.15s}
.acenter:active{transform:scale(.99)}
.acenter .ac-h{display:flex;align-items:center;gap:10px}
.acenter .ac-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--sage),var(--tan));display:flex;align-items:center;justify-content:center}
.acenter .ac-logo b{font-family:'Fraunces';font-style:italic;color:#0c1410;font-size:18px}
.acenter .ac-h b{font-size:15px;font-weight:700}
.acenter .ac-sub{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
.acenter .ac-row{display:flex;gap:18px;margin-top:14px}
.acenter .ac-row .aci{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:10px;font-weight:600}
.acenter .ac-row .aci .ico{width:20px;height:20px;color:var(--sage)}
.set-sec{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:18px 18px 6px}
.set-list{padding:0 8px}
.set-row{display:flex;align-items:center;gap:15px;padding:14px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
.set-row:active{background:var(--glass)}
.set-row .ico{width:22px;height:22px;color:var(--txt);flex-shrink:0}
.set-row .lbl{flex:1;font-size:14.5px;font-weight:500}
.set-row .chev{color:var(--dim)}
.set-row .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.set-row .lblw{flex:1}
.pro-pill{font-size:10px;font-weight:800;color:#0c1410;background:var(--tan);padding:2px 8px;border-radius:20px;margin-left:8px}

/* toast */
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--pine);
  border:1px solid rgba(127,184,151,.4);color:var(--txt);font-size:13px;padding:11px 18px;border-radius:30px;opacity:0;
  transition:.3s;z-index:90;pointer-events:none;font-weight:500;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app" data-mode="customer" id="app">

<!-- ============ HOME FEED ============ -->
<section class="screen root active" id="s-home">
  <div class="tbar">
    <div class="modesw"><div class="pill"></div>
      <button onclick="setMode('customer')">Discover</button>
      <button onclick="setMode('owner')">For Owners</button>
    </div>
    <div class="tbar-actions">
      <span class="badge-n" onclick="toast('Notifications')"><svg class="ico" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
      <span onclick="go('s-chat')"><svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
    </div>
  </div>
  <div class="scroll" id="feedScroll">
    <div class="stories" id="stories"></div>
    <div id="feedBody"></div>
  </div>
  <nav class="bnav" id="nav-home"></nav>
</section>

<!-- ============ PROFILE ============ -->
<section class="screen" id="s-profile">
  <div class="tbar">
    <span class="back" onclick="back()"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></span>
    <h2 id="pf-handle">sipcafe</h2>
    <div class="tbar-actions"><span onclick="go('s-settings')"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span></div>
  </div>
  <div class="scroll" id="profileBody"></div>

function attachCarousels(){
  document.querySelectorAll('.media').forEach(m=>{
    const track=m.querySelector('.track');if(!track)return;
    let sx=0;
    m.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
    m.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-sx;const dots=m.querySelectorAll('.dots i');if(!dots.length)return;
      let cur=[...dots].findIndex(d=>d.classList.contains('on'));
      if(dx<-40&&cur<dots.length-1)cur++;else if(dx>40&&cur>0)cur--;
      track.style.transform=`translateX(-${cur*100}%)`;dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
    });
  });
}

        <div class="posbadge">${it.pos}</div></div>
      <div class="pacts">
        <svg class="ico like liked" viewBox="0 0 24 24" onclick="likeToggle(this,event)"><path d="m12 21-1.5-1.3C5 14.9 2 12.2 2 8.8 2 6.1 4 4 6.5 4c1.5 0 3 .8 3.8 2 .8-1.2 2.3-2 3.8-2C20 4 22 6.1 22 8.8c0 3.4-3 6.1-8.5 10.9z"/></svg>
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <svg class="ico" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        <span class="sp"></span><svg class="ico" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div>
      <div class="plikes">${it.likes} likes</div>
      <div class="pcap"><b>${it.handle}</b> ${it.cap}</div>
    </article>
    <div class="cmts">${comments.map(c=>`<div class="cmt ${c.ai?'ai':''}">
      ${c.ai?`<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--tan));display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg class="ico" style="width:18px;height:18px;color:#0c1410" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></div>`:`<img src="${c.av}">`}
      <div class="ct"><b>${c.name}</b> ${c.text}<div class="meta"><span>${c.time}</span><span>${c.likes==='—'?'grounded ✓':c.likes+' likes'}</span><span>Reply</span></div></div>
      <svg class="ico heart" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="m12 21-1.5-1.3C5 14.9 2 12.2 2 8.8 2 6.1 4 4 6.5 4c1.5 0 3 .8 3.8 2 .8-1.2 2.3-2 3.8-2C20 4 22 6.1 22 8.8c0 3.4-3 6.1-8.5 10.9z"/></svg>
    </div>`).join('')}</div>`;
  attachCarousels();
}

function renderSettings(){
  $('settingsList').innerHTML=settings.map(g=>`<div class="set-sec">${g.sec}</div><div class="set-list">${g.rows.map(r=>`
    <div class="set-row" onclick="toast('${r.l.replace(/&amp;/g,'&').replace(/'/g,'')}')">
      <svg class="ico" viewBox="0 0 24 24">${r.i}</svg>
      <div class="lblw"><div style="display:flex;align-items:center">${r.l}${r.pro?'<span class="pro-pill">PRO</span>':''}</div>${r.sub?`<div class="sub">${r.sub}</div>`:''}</div>
      <svg class="ico chev" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </div>`).join('')}</div>`).join('');
}
function renderAccounts(){
  $('accountsBody').innerHTML=accounts.map(g=>`<div class="set-sec">${g.sec}</div><div class="set-list">${g.rows.map(r=>`
    <div class="set-row" onclick="toast('${r.l.replace(/&amp;/g,'&')}')">
      <svg class="ico" viewBox="0 0 24 24">${r.i}</svg>
      <div class="lblw"><div>${r.l}</div>${r.sub?`<div class="sub">${r.sub}</div>`:''}</div>
      <svg class="ico chev" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </div>`).join('')}</div>`).join('');
}

/* REELS */
function openReels(start=0){
  $('reelScroll').innerHTML=reels.map((r,i)=>`<div class="reel">
    <img class="bg" src="${r.bg}">
    <div class="rtop">
      <div class="ttl">${r.live?'<span class="livetag"><span class="pdot"></span>LIVE</span>':'Reels'}</div>
      ${r.live?`<div class="viewers"><svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>${r.viewers}</div>`:''}
    </div>
    ${r.live?`<div class="lchat">${r.chat.map(c=>`<div class="msg"><b>${c[0]}</b> ${c[1]}</div>`).join('')}</div>`:''}
    <div class="rside">
      <div class="act" onclick="likeToggle(this.querySelector('.ico'),event)"><svg class="ico" viewBox="0 0 24 24"><path d="m12 21-1.5-1.3C5 14.9 2 12.2 2 8.8 2 6.1 4 4 6.5 4c1.5 0 3 .8 3.8 2 .8-1.2 2.3-2 3.8-2C20 4 22 6.1 22 8.8c0 3.4-3 6.1-8.5 10.9z"/></svg><span>${r.likes}</span></div>
      <div class="act"><svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${r.cmts}</span></div>
      <div class="act"><svg class="ico" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg><span>Share</span></div>
      <div class="act"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></div>
    </div>
    <div class="rbot">
      <div class="rwho"><img src="${r.av}"><b>${r.handle}${r.verif?verifSvg:''}</b><button onclick="this.textContent='Following'">Follow</button></div>
      <div class="rcap">${r.cap}</div>
      <div class="rpos">${r.pos}</div>
    </div>
  </div>`).join('');
  $('reels').classList.add('active');
  setTimeout(()=>{const t=$('reelScroll');t.scrollTop=start*t.clientHeight;},50);
}
function closeReels(){$('reels').classList.remove('active');}

/* NAV BARS */
function renderNav(target,active){
  $(target).innerHTML=`
    <button class="${active==='home'?'on':''}" onclick="resetHome()"><svg class="ico" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</button>
    <button onclick="toast('Search')"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search</button>
    <button class="fab" onclick="toast('Create post / reel / go live')"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button onclick="openReels(0)"><svg class="ico" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg>Reels</button>
    <button class="${active==='profile'?'on':''}" onclick="goProfile()"><img class="meav" src="${IMG.sip}">You</button>`;
}
function resetHome(){while(navStack.length>1)back();}
function goProfile(){if(navStack[navStack.length-1]!=='s-profile')go('s-profile');}

/* INIT */
renderFeed();renderSettings();renderAccounts();
renderNav('nav-home','home');renderNav('nav-profile','profile');
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500);}
</script>
</body>
</html>
