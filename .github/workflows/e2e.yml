name: E2E Tests

# CI-E2E-1 — required GitHub Actions secrets (Settings > Secrets and
# variables > Actions) before the typecheck/e2e-local jobs below can run.
# These are FOUR INDEPENDENT secrets, not two pairs — setting the
# server-only pair does NOT mean the NEXT_PUBLIC_ pair exists too (this bit
# us once already: e2e/helpers/seed.ts only ever reads SUPABASE_URL /
# SUPABASE_SERVICE_ROLE_KEY, so a green "Seed test data" step is NOT
# evidence the NEXT_PUBLIC_ pair below is set — those two are read by
# `npm run build` to inline into the CLIENT bundle, and by middleware.ts /
# every server component at runtime; missing them there is invisible to
# seed.ts entirely and instead surfaces as the whole app 500ing):
#
#   SUPABASE_URL                  — a dedicated TEST Supabase project URL.
#                                    NEVER point this at production.
#                                    (server-only — used by seed.ts + the
#                                    app's supabaseAdmin client)
#   SUPABASE_SERVICE_ROLE_KEY     — service-role key for that TEST project.
#                                    (server-only — same usage as above)
#   NEXT_PUBLIC_SUPABASE_URL      — same TEST project URL, but this is the
#                                    SEPARATE secret the app itself needs —
#                                    inlined into the client bundle at BUILD
#                                    time and read by middleware.ts / every
#                                    server component at RUNTIME. Verify
#                                    this one explicitly; it is not implied
#                                    by SUPABASE_URL being set.
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — anon key for that TEST project — same
#                                    "separate secret, verify explicitly"
#                                    note as above.
#   TEST_USER_EMAIL               — a real Supabase Auth user that already
#                                    exists in the TEST project (create once
#                                    via the dashboard or Admin API — the
#                                    seed script provisions business data,
#                                    not the auth user itself).
#   TEST_USER_PASSWORD            — that user's password.
#
# Deliberately NOT included: any Stripe or ClickSend key, test or prod.
# Specs that need live Stripe are quarantined — see e2e/payment.spec.ts
# (test.skip + // QUARANTINE comments), not deleted.
#
# The `test` job below (repository_dispatch, prod smoke test against the
# live site) is unrelated pre-existing infrastructure, untouched — it uses
# the same TEST_USER_EMAIL/PASSWORD secrets but runs against production.

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'

jobs:
  typecheck:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CI-FIX-1 — incremental (tsconfig.json) + this cache mean a repeat run only re-checks
      # files that actually changed since the last cached .tsbuildinfo, instead of a full
      # from-scratch project check every time.
      - name: Cache TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('package-lock.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-

      - name: Typecheck
        run: npx tsc --noEmit

  e2e-local:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      # MS8 phase 5 — the fixture is resolved EXPLICITLY. The old "newest owned business" heuristic
      # let an unrelated sprint's smoke fixture silently repoint this whole suite (CI-TRIAGE-2 §3).
      # A literal, not a secret: it is the fixed seed UUID from e2e/helpers/seed.ts, public in-repo.
      TEST_BUSINESS_ID: 00000000-0000-4000-a000-000000000001
      BASE_URL: http://localhost:3000
      # ── S10 PHASE 1 — THE LIMITER'S BACKING STORE MUST REACH THE CI WEB SERVER ──────────────
      # `next start` sets NODE_ENV=production, so src/lib/rate-limit.ts takes its PRODUCTION
      # branch — and that branch FAILS CLOSED when Upstash is unreachable, by design
      # (SECURITY-P1 M-01: a missing env var must never silently strip rate limiting). Both
      # variables are set in Vercel, but CI's web server runs outside Vercel and nothing passed
      # them in, so every limited route returned 429 on its FIRST call. That is what
      # "Too many attempts" was: not a count, a limiter with nowhere to count.
      #
      # Job-level, so the webServer step inherits them — the same reason NODE_OPTIONS moved here
      # in CI-FIX-1. Values are never echoed; the check step below asserts presence only.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # CI-FIX-1 — job-level so the "Build (TEST env)" step's `npm run build` inherits it too
      # (GitHub merges job-level env into every step; a step's own env: only overrides the keys
      # it redeclares). Same 6GB heap the typecheck job already uses.
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Proves which of the 4 Supabase secrets are actually present BEFORE
      # spending a build on it — seed.ts succeeding later is NOT evidence
      # the NEXT_PUBLIC_ pair exists (see the header comment above). Never
      # prints values, only presence/length, safe to appear in public logs.
      - name: Verify required secrets are present
        run: |
          check() {
            local val="${!1}"
            if [ -z "$val" ]; then
              echo "::error::$1 is EMPTY or unset — set it in Settings > Secrets and variables > Actions"
              MISSING=1
            else
              echo "$1 is set (${#val} chars)"
            fi
          }
          MISSING=0
          check NEXT_PUBLIC_SUPABASE_URL
          check NEXT_PUBLIC_SUPABASE_ANON_KEY
          check SUPABASE_URL
          check SUPABASE_SERVICE_ROLE_KEY
          check TEST_USER_EMAIL
          check TEST_USER_PASSWORD
          if [ "$MISSING" = "1" ]; then exit 1; fi

      # NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD time,
      # not read at server-start time — explicit here even though the job-
      # level env: block above already covers this step, so it's never
      # ambiguous which vars this specific step needs.
      - name: Build (TEST env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Seed test data (idempotent — Sip business, staff, products, reward)
        run: npx tsx e2e/helpers/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: npm run start &

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time"
          exit 1

      - name: Run e2e specs (quarantined specs self-skip via test.skip)
        run: npx playwright test --project=chromium --reporter=github,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Pre-existing prod smoke test — unchanged, kept as-is per RULE0 ─────────
  test:
    if: github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        env:
          BASE_URL: https://www.ariaos.site
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
