name: Smoke Suite

# SECURITY-P2 (item 4) — wires tests/smoke/ (RULE 13, playwright.smoke.config.ts) into CI.
# Runs on pushes to main and on PRs touching src/ (unlike e2e.yml's typecheck/e2e-local, which
# run on EVERY push/PR regardless of path) — the smoke suite specifically proves auth/routing/
# middleware/RLS changes didn't regress normal owner/admin/customer flows, so it only needs to
# gate the code that could cause that regression.
#
# SETUP-1 PHASE 1 — THIS WORKFLOW HAD NEVER EXECUTED. NOT ONCE, IN ANY RUN, EVER.
#
# It triggered on `pull_request` only, and this repo's real workflow — the one CLAUDE.md mandates —
# is a direct `git push origin main` with no PR step. The trigger had therefore never fired: 0 runs
# against 89 for Canon Rail Guard and 2,441 for E2E Tests, confirmed against the Actions API on
# 2026-08-17. A required check that has never run is not a gate; RULE 13's claim that this "also
# runs in CI" was aspirational.
#
# This is the IDENTICAL defect canon-rail-guard.yml carried and fixed in SECURITY-RESIDUE-FIX-1
# PART 2 (see that file's header — "the guard had therefore never once executed against a real
# commit despite being wired into CI"). That fix did not sweep its siblings, so this one sat
# broken for the same reason for another month. The push trigger below is copied from it.
#
# Required GitHub secrets — SAME SIX as e2e.yml (reuse, do not duplicate/rename):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL,
#   NEXT_PUBLIC_SUPABASE_ANON_KEY, TEST_USER_EMAIL, TEST_USER_PASSWORD
# Optional (positive admin-access assertion only — suite skips that one test if absent):
#   TEST_ADMIN_EMAIL, TEST_ADMIN_PASSWORD
# Turnstile: NOT a secret. Cloudflare's official always-pass test keys are public constants
# (documented at developers.cloudflare.com/turnstile/troubleshooting/testing) and are hardcoded
# below — never put a real TURNSTILE_SECRET_KEY in CI.

# TRIGGER BLOCK ONLY is copied from canon-rail-guard.yml — paths-filtered push on main, mirroring
# its pull_request paths exactly, so this runs on the commits that can actually cause the
# regression rather than on every commit.
#
# Canon Rail's "Determine diff base" step is DELIBERATELY NOT copied. That step exists because the
# guard is a diff scanner: it needs github.base_ref on pull_request and github.event.before on
# push to know which lines are new. The smoke suite diffs nothing — it builds the app and drives
# it with Playwright — so a diff base here would be a variable nothing reads.
#
# '.github/workflows/smoke.yml' is in both lists, which canon-rail-guard.yml does not do for its
# own file. Same principle though: canon-rail watches scripts/canon-rail-guard.ts, its own logic.
# This suite's logic lives in tests/smoke/** and playwright.smoke.config.ts (both already listed)
# plus this file. It also means a change to the trigger proves itself by firing — which is how
# this phase demonstrated the fix rather than asserting it.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/smoke/**'
      - 'playwright.smoke.config.ts'
      - 'package.json'
      - '.github/workflows/smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/smoke/**'
      - 'playwright.smoke.config.ts'
      - 'package.json'
      - '.github/workflows/smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      # Cloudflare official always-pass test keys — public, not secret.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
      TURNSTILE_SECRET_KEY: '1x0000000000000000000000000000000AA'
      BASE_URL: http://localhost:3000
      # CI-FIX-1 — job-level (was only set on the "Run smoke suite" step) so every step in this
      # job inherits the same 6GB heap the e2e.yml jobs use, ahead of playwright.smoke.config.ts's
      # webServer running `npm run build` inside that step.
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify required secrets are present
        run: |
          check() {
            local val="${!1}"
            if [ -z "$val" ]; then
              echo "::error::$1 is EMPTY or unset — set it in Settings > Secrets and variables > Actions"
              MISSING=1
            else
              echo "$1 is set (${#val} chars)"
            fi
          }
          MISSING=0
          check NEXT_PUBLIC_SUPABASE_URL
          check NEXT_PUBLIC_SUPABASE_ANON_KEY
          check SUPABASE_URL
          check SUPABASE_SERVICE_ROLE_KEY
          check TEST_USER_EMAIL
          check TEST_USER_PASSWORD
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # CI-FIX-1 — same incremental-build cache as e2e.yml's typecheck job; playwright.smoke.
      # config.ts's webServer runs `npm run build`, which type-checks as part of the Next.js
      # build, and benefits from the same .tsbuildinfo (tsconfig.json's incremental: true).
      - name: Cache TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('package-lock.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-

      # playwright.smoke.config.ts's own webServer runs `npm run build && npm run start` — no
      # separate build step here (reuseExistingServer is false under CI, so it always rebuilds
      # itself regardless; a second explicit build step would just double the work). NODE_OPTIONS
      # is now set job-level above (was step-scoped here only) so it's inherited automatically.
      - name: Run smoke suite
        run: npx playwright test --config=playwright.smoke.config.ts --reporter=github,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7
